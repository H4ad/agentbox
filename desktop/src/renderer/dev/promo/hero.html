<!doctype html>
<!--
  The showcase hero: "one lead, many agents", drawn from the app's own palette,
  type and marks (styles.css, AgentCharacter.tsx), as a still for Discord,
  Reddit and link previews. scripts/promo.mjs renders it; ?v= picks a layout
  (flow, plane, burst) and ?og=1 frames it for a 1200×630 preview.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: "Inter Variable"; font-weight: 100 900; src: url("../../../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono Variable"; font-weight: 100 800; src: url("../../../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); }

:root {
  --brand-300: #c4b5fd; --brand-400: #a78bfa; --brand-500: #8b5cf6; --brand-600: #7c3aed;
  --mid: #6366f1; --deep: #4f46e5; --far: #38bdf8;
  --ink: #07070b; --chat: #09090d; --composer: #131318; --stage: #0a0a0f;
  --title: #fafafa; --primary: #f4f4f5; --secondary: #e4e4e7; --tertiary: #d4d4d8;
  --muted: #a1a1aa; --subtle: #71717a; --faint: #52525b; --ghost: #3f3f46;
  --line: rgb(255 255 255 / 0.065); --line-strong: rgb(255 255 255 / 0.1); --line-vivid: rgb(255 255 255 / 0.15);
  --surface: rgb(255 255 255 / 0.05); --surface-raised: rgb(255 255 255 / 0.065); --surface-strong: rgb(255 255 255 / 0.09);
  --emerald: #34d399; --amber: #fbbf24; --rose: #fb7185; --claude: #d97757;
  --sans: "Inter Variable", system-ui, sans-serif;
  --mono: "JetBrains Mono Variable", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
body { font-family: var(--sans); color: var(--primary); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
body.og { width: 1200px; height: 630px; }

#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
  background:
    radial-gradient(1100px 620px at 50% -8%, rgb(139 92 246 / 0.20), transparent 70%),
    radial-gradient(900px 600px at 100% 0%, rgb(56 189 248 / 0.08), transparent 70%),
    radial-gradient(900px 700px at 0% 100%, rgb(79 70 229 / 0.10), transparent 70%),
    var(--ink);
}
#grid { position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgb(255 255 255 / 0.028) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 0.028) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(1200px 760px at 50% 45%, black, transparent 80%);
}
#vignette { position: absolute; inset: 0; pointer-events: none; z-index: 50;
  background: radial-gradient(1500px 900px at 50% 50%, transparent 55%, rgb(0 0 0 / 0.55));
}
#grain { position: absolute; inset: 0; pointer-events: none; z-index: 51; opacity: 0.06; mix-blend-mode: overlay; }

#world { position: absolute; inset: 0; transform-style: preserve-3d; }
#flat { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

/* A panel, as .panel in styles.css: a faint gradient down a card and a lifted edge. */
.panel { position: absolute; border-radius: 16px; border: 1px solid var(--line-strong);
  background: linear-gradient(180deg, rgb(255 255 255 / 0.05), rgb(255 255 255 / 0.018)), rgb(13 13 18 / 0.92);
  box-shadow: 0 1px 0 rgb(255 255 255 / 0.06) inset, 0 30px 60px -24px rgb(0 0 0 / 0.9), 0 0 0 1px rgb(0 0 0 / 0.4);
  backdrop-filter: blur(14px);
}

/* Agent tile */
.agent { width: 300px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.agent .hd { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { position: relative; flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: linear-gradient(135deg, rgb(139 92 246 / 0.22), rgb(99 102 241 / 0.07) 50%, transparent);
  display: grid; place-items: center; }
.av svg { width: 60%; height: 60%; }
.av .dot { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 99px; box-shadow: 0 0 0 2px var(--ink); }
.agent.asking .av { border-color: rgb(251 191 36 / 0.45); background: linear-gradient(135deg, rgb(251 191 36 / 0.2), transparent 60%); box-shadow: 0 0 14px -6px rgb(251 191 36 / 0.7); }
.ttl { min-width: 0; flex: 1; }
.ttl .name { font-size: 13.5px; font-weight: 600; color: var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.ttl .br { margin-top: 2px; font: 500 10.5px/1.2 var(--mono); color: var(--subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.ttl .br svg { flex: none; width: 11px; height: 11px; stroke: var(--brand-400); }
.chip { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; padding: 3px 7px; border-radius: 99px; border: 1px solid; }
.chip i { width: 6px; height: 6px; border-radius: 99px; background: currentColor; box-shadow: 0 0 8px currentColor; }
.chip.working { color: var(--brand-300); border-color: rgb(167 139 250 / 0.3); background: rgb(139 92 246 / 0.12); }
.chip.review { color: #6ee7b7; border-color: rgb(52 211 153 / 0.3); background: rgb(52 211 153 / 0.1); }
.chip.asking { color: #fcd34d; border-color: rgb(251 191 36 / 0.35); background: rgb(251 191 36 / 0.1); }
.chip.merged { color: var(--brand-300); border-color: rgb(167 139 250 / 0.3); background: rgb(139 92 246 / 0.16); }

.thumb { position: relative; height: 96px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); }
.thumb.term { padding: 8px 10px; font: 500 9.5px/1.48 var(--mono); color: var(--tertiary); white-space: pre; background: linear-gradient(180deg, #0b0b11, #08080c); }
.thumb.term .c-b { color: var(--brand-400); } .thumb.term .c-g { color: var(--emerald); } .thumb.term .c-s { color: var(--subtle); }
.thumb.term .c-y { color: var(--amber); } .thumb.term .c-o { color: #e59a7c; } .thumb.term .c-k { color: var(--far); }
.cur { display: inline-block; width: 6px; height: 11px; background: var(--brand-300); vertical-align: -2px; box-shadow: 0 0 8px var(--brand-400); }
.thumb .tag { position: absolute; right: 6px; top: 6px; font: 600 8.5px/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 3px 5px; border-radius: 5px; background: rgb(0 0 0 / 0.55); border: 1px solid var(--line); }
.thumb .tag b { display: inline-block; width: 5px; height: 5px; border-radius: 9px; background: #f43f5e; margin-right: 4px; vertical-align: 1px; box-shadow: 0 0 6px #f43f5e; }

/* desktop thumbnail: a little browser */
.desk { background: #0d0d14; }
.desk .bar { height: 15px; display: flex; align-items: center; gap: 3px; padding: 0 6px; background: #16161d; border-bottom: 1px solid var(--line); }
.desk .bar i { width: 5px; height: 5px; border-radius: 9px; background: var(--ghost); }
.desk .bar u { margin-left: 6px; flex: 1; height: 8px; border-radius: 4px; background: rgb(255 255 255 / 0.06); font: 500 6px/8px var(--mono); color: var(--subtle); text-decoration: none; padding-left: 5px; }
.desk .pg { position: absolute; inset: 15px 0 0 0; display: flex; }
.desk .side { width: 46px; border-right: 1px solid var(--line); padding: 6px 5px; display: flex; flex-direction: column; gap: 4px; background: rgb(0 0 0 / 0.25); }
.desk .side span { height: 5px; border-radius: 3px; background: rgb(255 255 255 / 0.08); }
.desk .side span.on { background: rgb(139 92 246 / 0.5); }
.desk .main { flex: 1; padding: 7px; display: flex; flex-direction: column; gap: 5px; }
.desk .row { display: flex; gap: 5px; }
.blk { border-radius: 4px; background: rgb(255 255 255 / 0.06); border: 1px solid rgb(255 255 255 / 0.04); }
.blk.v { background: linear-gradient(135deg, rgb(139 92 246 / 0.55), rgb(79 70 229 / 0.35)); border-color: rgb(167 139 250 / 0.4); }
.blk.s { background: linear-gradient(135deg, rgb(56 189 248 / 0.35), rgb(56 189 248 / 0.1)); }
.blk.g { background: rgb(52 211 153 / 0.25); }
.ln { height: 4px; border-radius: 2px; background: rgb(255 255 255 / 0.1); }
.phone { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); width: 50px; height: 100px; border-radius: 9px; border: 2px solid #2a2a33; background: #101017; padding: 7px 4px; display: flex; flex-direction: column; gap: 3px; }

.agent .ft { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--muted); }
.tool { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px 2px 4px; border-radius: 6px; background: var(--surface-raised); border: 1px solid var(--line); font-weight: 600; color: var(--secondary); }
.tool svg { width: 13px; height: 13px; }
.ft .ref { font-family: var(--mono); color: var(--subtle); }
.ft .diff { margin-left: auto; font-family: var(--mono); font-weight: 600; }
.ft .diff .a { color: var(--emerald); } .ft .diff .d { color: var(--rose); }

/* Lead chat */
.lead { display: flex; flex-direction: column; overflow: hidden; border-radius: 20px; background: linear-gradient(180deg, rgb(255 255 255 / 0.045), rgb(255 255 255 / 0.01)), var(--chat);
  border-color: rgb(167 139 250 / 0.28);
  box-shadow: 0 1px 0 rgb(255 255 255 / 0.08) inset, 0 0 0 1px rgb(0 0 0 / 0.5), 0 40px 90px -30px rgb(0 0 0 / 0.95), 0 0 120px -20px rgb(139 92 246 / 0.45);
}
.lead .top { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); background: rgb(0 0 0 / 0.2); }
.logo { flex: none; width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #a78bfa, #7c3aed 55%, #4f46e5); display: grid; place-items: center; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.15) inset, 0 6px 20px -6px rgb(124 58 237 / 0.8); }
.logo svg { width: 62%; height: 62%; }
.lead .top .t { font-size: 15px; font-weight: 650; color: var(--title); letter-spacing: -0.01em; }
.lead .top .s { font-size: 11.5px; color: var(--subtle); margin-top: 1px; }
.lead .top .pill { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface); display: flex; gap: 6px; align-items: center; }
.lead .top .pill i { width: 6px; height: 6px; border-radius: 9px; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
.lead .msgs { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.bubble { align-self: flex-end; max-width: 86%; padding: 11px 14px; border-radius: 16px 16px 4px 16px; background: linear-gradient(135deg, rgb(139 92 246 / 0.28), rgb(79 70 229 / 0.2)); border: 1px solid rgb(167 139 250 / 0.28); font-size: 13.5px; line-height: 1.5; color: var(--primary); }
.reply { font-size: 13.5px; line-height: 1.55; color: var(--secondary); }
.reply b { color: var(--title); font-weight: 600; }
.calls { display: flex; flex-direction: column; gap: 6px; }
.call { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgb(255 255 255 / 0.03); font-size: 12px; color: var(--tertiary); }
.call .ic { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: rgb(139 92 246 / 0.15); border: 1px solid rgb(167 139 250 / 0.25); }
.call .ic svg { width: 14px; height: 14px; }
.call code { font: 500 11px var(--mono); color: var(--brand-300); }
.call .k { margin-left: auto; font: 500 10.5px var(--mono); color: var(--subtle); }
.call .ok { color: var(--emerald); font-weight: 700; }
.composer { margin: 0 14px 14px; border-radius: 14px; background: var(--composer); border: 1px solid var(--line-strong); padding: 12px 14px 10px; box-shadow: 0 -10px 30px -10px rgb(0 0 0 / 0.6); }
.composer .ph { font-size: 13.5px; color: var(--subtle); }
.composer .row { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.composer .row .m svg { width: 13px; height: 13px; }
.composer .row .m { padding: 3px 8px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); display: flex; gap: 5px; align-items: center; font-weight: 600; }
.composer .send { margin-left: auto; width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--brand-400), var(--brand-600)); display: grid; place-items: center; box-shadow: 0 4px 16px -4px rgb(139 92 246 / 0.9); }

/* Review & merge stack */
.stack { position: absolute; }
.stack .h { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 12px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stack .h .n { padding: 1px 7px; border-radius: 99px; background: rgb(52 211 153 / 0.12); color: #6ee7b7; border: 1px solid rgb(52 211 153 / 0.3); letter-spacing: 0; }
.pr { position: relative; padding: 14px 16px; }
.pr .r1 { display: flex; align-items: center; gap: 8px; }
.pr .num { font: 600 12px var(--mono); color: var(--subtle); }
.pr .t { font-size: 14px; font-weight: 600; color: var(--title); letter-spacing: -0.01em; line-height: 1.35; margin-top: 6px; }
.pr .meta { margin-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
.pr .meta .ck { color: var(--emerald); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.pr .meta .df { font-family: var(--mono); font-weight: 600; }
.pr .meta .df .a { color: var(--emerald); } .pr .meta .df .d { color: var(--rose); }
.pr .shot { margin-top: 12px; height: 118px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; position: relative; background: #0d0d14; }
.mergebtn { display: inline-flex; margin-left: auto; border-radius: 9px; overflow: hidden; box-shadow: 0 6px 22px -6px rgb(52 211 153 / 0.7); }
.mergebtn span { padding: 6px 12px; font-size: 12px; font-weight: 650; color: #052e1f; background: linear-gradient(180deg, #6ee7b7, #34d399); display: flex; align-items: center; gap: 6px; }
.mergebtn span + span { padding: 6px 7px; border-left: 1px solid rgb(5 46 31 / 0.25); }
.ghostbtn { padding: 6px 11px; font-size: 12px; font-weight: 600; border-radius: 9px; color: var(--secondary); background: var(--surface-strong); border: 1px solid var(--line-strong); }
.merged-list { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
.mrow { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line); background: rgb(255 255 255 / 0.025); font-size: 12px; color: var(--tertiary); }
.mrow svg { flex: none; width: 15px; height: 15px; stroke: var(--brand-400); }
.mrow .num { font: 600 11px var(--mono); color: var(--subtle); }
.mrow .w { margin-left: auto; font-size: 10.5px; color: var(--subtle); }

/* Type */
.wordmark { position: absolute; display: flex; align-items: center; gap: 12px; z-index: 60; }
.wordmark .logo { width: 38px; height: 38px; border-radius: 10px; }
.wordmark span { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; color: var(--title); }
.url { position: absolute; z-index: 60; font: 500 15px var(--mono); color: var(--muted); letter-spacing: 0.01em; }
.url b { color: var(--brand-300); font-weight: 500; }
.headline { position: absolute; z-index: 60; font-weight: 750; letter-spacing: -0.045em; line-height: 0.98; color: var(--title); }
.headline em { font-style: normal; background: linear-gradient(100deg, #c4b5fd, #a78bfa 30%, #818cf8 60%, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { position: absolute; z-index: 60; font-size: 20px; line-height: 1.45; color: var(--muted); letter-spacing: -0.005em; }
.sub b { color: var(--secondary); font-weight: 550; }

.far { filter: blur(1.6px) brightness(0.72) saturate(0.85); }
.farther { filter: blur(3px) brightness(0.55) saturate(0.8); }
</style>
</head>
<body>

  <div id="grid"></div>
  <div id="world"><svg id="wires"></svg></div>

</div>

// Wires: a glowing bezier from a to b, with particles riding it.
const svg = document.getElementById('wires');
svg.setAttribute('width', 1920); svg.setAttribute('height', 1080);
svg.innerHTML = `<defs>
  <linearGradient id="gOut" gradientUnits="userSpaceOnUse" x1="0" x2="1920"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.6" stop-color="#818cf8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <linearGradient id="gIn" gradientUnits="userSpaceOnUse" x1="0" x2="1920"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="glowL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>`;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function wire(ax, ay, bx, by, o = {}) {
  const color = o.color || 'url(#gOut)', op = o.opacity ?? 1;
  const horiz = o.vertical ? false : true;
  const k = o.bend ?? 0.5;
  const d = horiz
    ? `M${ax},${ay} C${ax + (bx - ax) * k},${ay} ${bx - (bx - ax) * k},${by} ${bx},${by}`
    : `M${ax},${ay} C${ax},${ay + (by - ay) * k} ${bx},${by - (by - ay) * k} ${bx},${by}`;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('opacity', op);
  g.innerHTML = `<path d="${d}" stroke="${color}" stroke-width="7" fill="none" opacity="0.35" filter="url(#glow)"/>
    <path d="${d}" stroke="${color}" stroke-width="1.6" fill="none" opacity="0.9"/>
    <path d="${d}" stroke="#fff" stroke-width="0.6" fill="none" opacity="0.35"/>`;
  svg.appendChild(g);
  const p = g.querySelector('path');
  const L = p.getTotalLength();
  const n = o.particles ?? 3;
  for (let i = 0; i < n; i++) {
    const t = (i + 0.25 + rnd() * 0.5) / n;
    const pt = p.getPointAtLength(L * t);
    const pc = o.pcolor || '#e9d5ff';
    g.insertAdjacentHTML('beforeend', `<circle cx="${pt.x}" cy="${pt.y}" r="7" fill="${pc}" opacity="0.5" filter="url(#glowS)"/><circle cx="${pt.x}" cy="${pt.y}" r="2.2" fill="#fff"/>`);
  }
  // end caps
  g.insertAdjacentHTML('beforeend', `<circle cx="${bx}" cy="${by}" r="3.2" fill="${o.cap || '#c4b5fd'}"/><circle cx="${bx}" cy="${by}" r="9" fill="${o.cap || '#c4b5fd'}" opacity="0.35" filter="url(#glowS)"/>`);
}

      const r = rectOf(el);
      const left = r.x < L.x;
      wire(r.x + r.w / 2, r.y + r.h, left ? S.x : S.x + S.w, S.y + 120, { vertical: true, color: 'url(#gIn)', cap: '#6ee7b7', pcolor: '#a7f3d0', opacity: 0.85 });
    }
  },
};
layouts[V]();

// Film grain, seeded so every render is the same.
(() => {
  const c = document.getElementById('grain'), x = c.getContext('2d'), img = x.createImageData(1920, 1080);
  let s = 12345;
  for (let i = 0; i < img.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = (s & 255); img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  x.putImageData(img, 0, 0);
})();

// ?og=1: a 1200×630 frame of the same scene, scaled and centred on ?ox,?oy.
if (params.get('og')) {
  document.body.classList.add('og');
  const s = +(params.get('s') || 0.625), ox = +(params.get('ox') || 960), oy = +(params.get('oy') || 540);
  document.getElementById('stage').style.transform = `translate(${600 - ox * s}px, ${315 - oy * s}px) scale(${s})`;
}
document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
</script>
</body>
